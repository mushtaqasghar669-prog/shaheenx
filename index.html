<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>ShaheenX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100%;width:100%;overscroll-behavior:none}
button,input,textarea{font-family:inherit;color:inherit;outline:none;border:none}
button{background:none;cursor:pointer}
img,video{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0}

/* LOADER */
#loader{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s}
#loader .logo{font-size:42px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#loader .bar{width:200px;height:3px;background:#1a1a1a;border-radius:3px;overflow:hidden}
#loader .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d55,#3b82f6);transition:width .3s ease}
#loader .msg{font-size:11.5px;color:#666;letter-spacing:.6px}

/* AUTH */
#auth{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;padding:26px;background:radial-gradient(1000px 500px at 50% -10%,#1a0a14 0%,#000 65%);z-index:200;overflow-y:auto}
#auth .brand{font-size:44px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#auth .tag{text-align:center;color:#777;font-size:12.5px;margin:6px 0 32px;letter-spacing:.4px}
#auth .field{background:#0e0e0e;border:1px solid #1c1c1c;border-radius:13px;padding:15px 16px;margin-bottom:11px;display:flex;align-items:center;gap:10px;transition:.15s}
#auth .field:focus-within{border-color:#333}
#auth .field input{background:none;border:none;flex:1;font-size:15px;color:#fff}
#auth .field input::placeholder{color:#555}
#auth .btn{width:100%;padding:15px;border-radius:13px;font-weight:800;font-size:14.5px;margin-top:10px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
#auth .btn:active{transform:scale(.98)}
#auth .primary{background:linear-gradient(135deg,#ff2d55,#ff5a7a);color:#fff}
#auth .primary:disabled{opacity:.55}
#auth .ghost{background:#111;border:1px solid #1e1e1e;color:#fff}
#auth .forgot{text-align:center;color:#888;font-size:12.5px;margin-top:16px;cursor:pointer}
#auth .switch{text-align:center;color:#888;font-size:13px;margin-top:20px;cursor:pointer}
#auth .switch b{color:#ff2d55}

/* APP */
#app{display:none;flex-direction:column;height:100dvh;width:100%}
#topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #0f0f0f;background:#000;flex-shrink:0;z-index:10}
#topbar .name{font-size:22px;font-weight:900;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#topbar .active{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:#0f0f0f;font-size:11.5px;color:#9f9;font-weight:700}
#topbar .active i{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#topbar .refresh{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0f0f0f}
#topbar .refresh svg{width:18px;height:18px;color:#fff}
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.active{display:block}

/* BOTTOM NAV */
#bottomnav{height:60px;display:flex;background:#000;border-top:1px solid #0f0f0f;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:100}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#666;font-size:10px;font-weight:700;letter-spacing:.2px;transition:.15s}
#bottomnav button.on{color:#fff}
#bottomnav button svg{width:22px;height:22px;stroke-width:2}
#bottomnav button.on svg{stroke-width:2.4}

/* HOME FEED */
.feed{padding:10px 12px 100px}
.card{background:#0a0a0a;border:1px solid #131313;border-radius:16px;overflow:hidden;margin-bottom:14px}
.card .head{display:flex;align-items:center;gap:10px;padding:11px 13px}
.card .head img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#1a1a1a;flex-shrink:0}
.card .head .nm{font-size:13.5px;font-weight:800}
.card .head .tm{font-size:11px;color:#777;margin-top:1px}
.card .media{width:100%;background:#000;max-height:72vh;object-fit:contain}
.card .body{padding:11px 13px 4px}
.card .ttl{font-size:14.5px;font-weight:800;margin-bottom:4px;line-height:1.35}
.card .dsc{font-size:12.5px;color:#aaa;line-height:1.45}
.card .acts{display:flex;gap:20px;padding:10px 13px 13px}
.card .acts button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#b8b8b8;font-weight:700}
.card .acts svg{width:19px;height:19px}
.card .acts .liked{color:#ff2d55}
.card .acts .liked svg{fill:#ff2d55;stroke:#ff2d55}

.empty{padding:70px 24px;text-align:center;color:#666}
.empty h3{color:#fff;margin-bottom:8px;font-size:16px;font-weight:800}
.empty p{font-size:13px;line-height:1.5}
.empty svg{width:60px;height:60px;color:#333;margin-bottom:14px}

/* SHORTS */
#view-shorts{overflow:hidden;background:#000}
#shortsWrap{height:100%;width:100%;position:relative;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shorts-item{height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.shorts-item video{width:100%;height:100%;object-fit:contain;background:#000}
.shorts-item .gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 25%,transparent 55%,rgba(0,0,0,.85) 100%);pointer-events:none}
.shorts-info{position:absolute;left:14px;right:85px;bottom:80px;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.shorts-info .row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.shorts-info .row img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;flex-shrink:0}
.shorts-info .row .nm{font-size:15px;font-weight:900}
.shorts-info .row button{margin-left:6px;font-size:11.5px;font-weight:900;padding:6px 13px;border-radius:20px;background:#ff2d55;color:#fff;letter-spacing:.3px}
.shorts-info .row button.following{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
.shorts-info .ttl{font-size:14.5px;font-weight:800;margin-bottom:5px;line-height:1.35}
.shorts-info .dsc{font-size:13px;color:#e8e8e8;line-height:1.4;max-height:56px;overflow:hidden}
.shorts-side{position:absolute;right:8px;bottom:80px;z-index:3;display:flex;flex-direction:column;gap:20px;align-items:center}
.shorts-side button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#fff;min-width:50px}
.shorts-side svg{width:32px;height:32px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));transition:.15s}
.shorts-side button:active svg{transform:scale(.88)}
.shorts-side .liked svg{fill:#ff2d55;stroke:#ff2d55}
.shorts-side .liked span{color:#ff2d55}
#playPauseOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#playPauseOverlay.show{display:flex}
#playPauseOverlay .logo{width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);animation:fadeIn .25s;border:2px solid rgba(255,255,255,.15)}
#playPauseOverlay .logo svg{width:50px;height:50px;color:#fff}
@keyframes fadeIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

/* UPLOAD */
.upl{padding:16px;padding-bottom:100px;max-width:640px;margin:0 auto}
.upl .tabs{display:flex;gap:6px;margin-bottom:20px;background:#0a0a0a;padding:5px;border-radius:14px;border:1px solid #131313}
.upl .tabs button{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:800;color:#777;transition:.15s}
.upl .tabs button.on{background:linear-gradient(135deg,#ff2d55,#ff5a7a);color:#fff}
.upl .drop{border:2px dashed #222;border-radius:18px;padding:36px 20px;text-align:center;background:#0a0a0a;margin-bottom:16px;cursor:pointer;transition:.15s}
.upl .drop:active{border-color:#ff2d55;background:#0f0a0d}
.upl .drop svg{width:44px;height:44px;color:#444;margin-bottom:12px}
.upl .drop p{font-size:14.5px;color:#fff;font-weight:800;margin-bottom:5px}
.upl .drop small{display:block;color:#777;font-size:11.5px;margin-top:3px}
.upl .prev{width:100%;border-radius:16px;margin-bottom:16px;background:#000;max-height:62vh;object-fit:contain;border:1px solid #1a1a1a}
.upl label{font-size:12px;color:#999;display:flex;justify-content:space-between;margin:16px 0 7px;font-weight:800;letter-spacing:.2px;text-transform:uppercase}
.upl label span{color:#666;text-transform:none;font-weight:700}
.upl input[type=text],.upl textarea{width:100%;background:#0a0a0a;border:1px solid #1c1c1c;border-radius:13px;padding:14px 16px;font-size:14.5px;color:#fff;resize:none;transition:.15s}
.upl input:focus,.upl textarea:focus{border-color:#333;background:#0f0f0f}
.upl .count{text-align:right;font-size:11px;color:#666;margin-top:5px;font-weight:700}
.upl .count.over{color:#ff2d55}
.upl .submit{margin-top:22px;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#ff2d55,#ff5a7a);font-weight:900;font-size:15px;color:#fff;letter-spacing:.3px;transition:.15s}
.upl .submit:disabled{opacity:.5}
.upl .submit:active:not(:disabled){transform:scale(.98)}
.progress{margin-top:18px;display:none;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:14px;padding:16px}
.progress.show{display:block}
.progress .track{height:6px;background:#1c1c1c;border-radius:6px;overflow:hidden}
.progress .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d55,#3b82f6);transition:width .2s;border-radius:6px}
.progress .lbl{font-size:12px;color:#aaa;margin-top:10px;display:flex;justify-content:space-between;font-weight:700}
.progress .lbl b{color:#fff;font-weight:900}

/* PROFILE */
.prof{padding-bottom:100px}
.bannerWrap{position:relative;height:150px;background:linear-gradient(135deg,#1a0a14,#0a1220);overflow:hidden}
.bannerWrap img{width:100%;height:100%;object-fit:cover}
.bannerWrap .edit{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.65);padding:8px 14px;border-radius:20px;font-size:11.5px;font-weight:800;color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}
.profHead{padding:0 16px;margin-top:-52px;position:relative}
.avatarWrap{position:relative;width:104px;height:104px}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid #000;object-fit:cover;background:#1a1a1a}
.avatarWrap .cam{position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%;background:#ff2d55;display:flex;align-items:center;justify-content:center;border:3px solid #000}
.avatarWrap .cam svg{width:14px;height:14px;color:#fff}
.profHead .nm{font-size:22px;font-weight:900;margin-top:10px;line-height:1.2}
.profHead .em{font-size:12.5px;color:#777;margin-top:3px}
.stats{display:flex;gap:28px;padding:18px 16px 0;align-items:center}
.stats .stat{text-align:left}
.stats .stat b{display:block;font-size:17px;color:#fff;font-weight:900;line-height:1.2}
.stats .stat span{font-size:11px;color:#777;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;display:block}
.stats .dots{margin-left:auto;padding:9px 15px;border-radius:22px;background:#111;font-size:15px;font-weight:900;letter-spacing:1px;border:1px solid #1e1e1e}
.tabs2{display:flex;border-top:1px solid #0f0f0f;border-bottom:1px solid #0f0f0f;margin-top:16px;position:sticky;top:0;background:#000;z-index:5}
.tabs2 button{flex:1;padding:15px;font-size:12.5px;font-weight:900;color:#666;border-bottom:2px solid transparent;letter-spacing:.4px;text-transform:uppercase;transition:.15s}
.tabs2 button.on{color:#fff;border-color:#ff2d55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.grid .cell{aspect-ratio:9/16;background:#111;overflow:hidden;position:relative;cursor:pointer}
.grid .cell video,.grid .cell img{width:100%;height:100%;object-fit:cover}
.grid .cell .cnt{position:absolute;bottom:5px;left:7px;font-size:10.5px;font-weight:900;text-shadow:0 1px 4px #000;display:flex;align-items:center;gap:4px}
.grid .cell .cnt svg{width:11px;height:11px}

/* SHEETS */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(6px)}
.sheet.show{display:flex}
.sheet .panel{background:#0c0c0c;width:100%;border-radius:22px 22px 0 0;padding:8px 8px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:up .22s ease;border-top:1px solid #1a1a1a}
@keyframes up{from{transform:translateY(60px);opacity:.7}to{transform:translateY(0);opacity:1}}
.sheet .handle{width:40px;height:4px;background:#333;border-radius:4px;margin:8px auto 14px}
.sheet h4{font-size:13px;font-weight:900;color:#777;padding:6px 14px 10px;text-transform:uppercase;letter-spacing:.5px}
.sheet .item{display:flex;align-items:center;gap:14px;padding:15px 14px;border-radius:14px;font-size:14.5px;width:100%;text-align:left;font-weight:700;color:#fff;transition:.15s}
.sheet .item:active{background:#171717}
.sheet .item svg{width:20px;height:20px;color:#999;flex-shrink:0}
.sheet .item.danger{color:#ff4d6d}
.sheet .item.danger svg{color:#ff4d6d}

/* COMMENTS */
.cmtSheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.cmtSheet.show{display:flex}
.cmtSheet .panel{background:#0c0c0c;width:100%;height:72vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease;border-top:1px solid #1a1a1a}
.cmtHead{padding:16px 18px 13px;border-bottom:1px solid #141414;display:flex;justify-content:space-between;align-items:center}
.cmtHead b{font-size:15px;font-weight:900}
.cmtHead button{color:#888;font-size:18px;font-weight:800;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cmtHead button:active{background:#1a1a1a}
.cmtList{flex:1;overflow-y:auto;padding:6px 14px}
.cmt{display:flex;gap:11px;padding:12px 2px}
.cmt img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1a1a1a;flex-shrink:0}
.cmt .cbody{flex:1;min-width:0}
.cmt .cnm{font-size:12.5px;font-weight:900;color:#fff}
.cmt .ctx{font-size:13.5px;line-height:1.4;margin-top:3px;word-break:break-word;color:#e8e8e8}
.cmt .cmeta{display:flex;gap:16px;font-size:11.5px;color:#777;margin-top:8px;font-weight:800;align-items:center}
.cmt .cmeta button{color:#888;font-size:11.5px;font-weight:800;padding:2px 0}
.cmt .cmeta .liked{color:#ff2d55}
.cmt .replies{margin-top:8px;padding-left:12px;border-left:2px solid #1c1c1c}
.cmt .replies .cmt{padding:8px 0}
.cmt .replies .cmt img{width:26px;height:26px}
.cmt .replies .cmt .cnm{font-size:11.5px}
.cmt .replies .cmt .ctx{font-size:12.5px}
.cmtBox{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #141414;display:flex;gap:9px;align-items:center;background:#0c0c0c}
.cmtBox input{flex:1;background:#161616;border:1px solid #222;border-radius:24px;padding:12px 18px;font-size:14px;color:#fff}
.cmtBox input:focus{border-color:#333}
.cmtBox button{padding:12px 18px;border-radius:24px;background:linear-gradient(135deg,#ff2d55,#ff5a7a);font-weight:900;font-size:13px;color:#fff}
.cmtBox button:disabled{opacity:.4}
.cmtBox button:active:not(:disabled){transform:scale(.95)}

/* TOAST */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:88px;background:#1c1c1c;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:.25s;pointer-events:none;border:1px solid #2a2a2a;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.spin{width:20px;height:20px;border:2.5px solid #2a2a2a;border-top-color:#ff2d55;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.big{width:34px;height:34px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.centerSpin{display:flex;justify-content:center;padding:40px}

/* SKELETON */
.sk{background:linear-gradient(90deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="logo">ShaheenX</div>
  <div class="bar"><span id="loadBar"></span></div>
  <div class="msg" id="loadMsg">Starting…</div>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="brand">ShaheenX</div>
  <div class="tag">Create · Share · Go Viral</div>

  <div id="fName" style="display:none">
    <div class="field"><input id="inName" placeholder="Channel name" maxlength="24" autocomplete="nickname"/></div>
  </div>
  <div class="field"><input id="inEmail" type="email" placeholder="Email" autocomplete="email"/></div>
  <div class="field"><input id="inPass" type="password" placeholder="Password" autocomplete="current-password"/></div>

  <button class="btn primary" id="btnMain">Sign In</button>
  <button class="btn ghost" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.9 7.1 29.2 5 24 5 12.9 5 4 13.9 4 25s8.9 20 20 20 20-8.9 20-20c0-1.5-.2-2.9-.4-4.5z"/><path fill="#FF3D00" d="M6.3 15.7l6.6 4.8C14.7 16.2 19 13 24 13c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.9 7.1 29.2 5 24 5 16.3 5 9.7 9.3 6.3 15.7z"/><path fill="#4CAF50" d="M24 45c5.1 0 9.8-2 13.3-5.2l-6.1-5.2C29.3 36 26.8 37 24 37c-5.3 0-9.7-2.6-11.3-7l-6.5 5C9.6 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.1 5.2C40.9 36 44 31 44 25c0-1.5-.2-2.9-.4-4.5z"/></svg>
    Continue with Google
  </button>
  <div class="forgot" id="linkForgot">Forgot password?</div>
  <div class="switch" id="switchMode">New here? <b>Create account</b></div>
</div>

<!-- APP -->
<div id="app">
  <header id="topbar">
    <div class="name">ShaheenX</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="active" id="activeBadge" style="display:none"><i></i><span id="activeCount">0</span> live</div>
      <button class="refresh" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
    </div>
  </header>

  <main id="views">
    <section class="view active" id="view-home"><div class="feed" id="feed"></div></section>
    <section class="view" id="view-shorts"><div id="shortsWrap"></div><div id="playPauseOverlay"><div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div></section>
    <section class="view" id="view-upload"><div class="upl" id="uplWrap"></div></section>
    <section class="view" id="view-history"><div class="feed" id="histFeed"></div></section>

/* ============================================================

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  databaseURL: "https://shaheenx-7d9ab-default-rtdb.firebaseio.com",

/* STATE */

let shortsObserver = null;
let viewTimers = {};
let currentCmtPost = null;

/* HELPERS */
const $ = id => document.getElementById(id);
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n||0); if(n>=1e9)return (n/1e9).toFixed(1)+'B'; if(n>=1e6)return (n/1e6).toFixed(1)+'M'; if(n>=1e3)return (n/1e3).toFixed(1)+'K'; return String(n); };
const timeAgo = t => { if(!t) return 'now'; const s = Math.floor((Date.now()-t)/1000); if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; if(s<604800)return Math.floor(s/86400)+'d'; return new Date(t).toLocaleDateString(); };
const avatar = (url, name) => {
  if (url) return url;
  const ch = (name||'U').trim().charAt(0).toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%' height='100%' fill='#1e1e1e'/><text x='50%' y='56%' font-size='56' font-family='sans-serif' font-weight='900' fill='#fff' text-anchor='middle' dominant-baseline='middle'>${ch}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
};
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============================================================
   LOADER (max 3.5s)
============================================================ */
function setLoad(p, txt){

/* ============================================================
   AUTH UI
============================================================ */
let authMode = 'login';
function setAuthMode(m){
  authMode = m;
  $('fName').style.display = m==='register' ? 'block' : 'none';
  $('btnMain').textContent = m==='register' ? 'Create Account' : 'Sign In';
  $('linkForgot').style.display = m==='login' ? 'block' : 'none';
  $('switchMode').innerHTML = m==='login' ? 'New here? <b>Create account</b>' : 'Already have an account? <b>Sign in</b>';
}
$('switchMode').onclick = () => setAuthMode(authMode==='login'?'register':'login');

$('btnMain').onclick = async () => {
  const email = $('inEmail').value.trim();
  const pass = $('inPass').value;
  const nm = $('inName').value.trim();
  if (!email || !pass) return toast('Fill email and password');
  if (pass.length < 6) return toast('Password must be 6+ chars');
  if (authMode==='register' && !nm) return toast('Enter channel name');
  $('btnMain').disabled = true;
  $('btnMain').innerHTML = '<span class="spin" style="border-top-color:#fff"></span>';
  try {
    if (authMode === 'login'){
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: nm });
    }
  } catch(e){
    toast(prettyErr(e));
    $('btnMain').disabled = false;
    $('btnMain').textContent = authMode==='login' ? 'Sign In' : 'Create Account';
  }
};

$('linkForgot').onclick = async () => {
  const email = $('inEmail').value.trim();
  if (!email) return toast('Enter your email first');
  try {
    await sendPasswordResetEmail(auth, email);
    toast('Reset link sent to your email ✅');
  } catch(e){ toast(prettyErr(e)); }
};

$('btnGoogle').onclick = async () => {
  try {
    await signInWithPopup(auth, gProvider);
  } catch(e){
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user'){
      try { await signInWithRedirect(auth, gProvider); } catch(e2){ toast(prettyErr(e2)); }
    } else {
      toast(prettyErr(e));
    }
  }
};

function prettyErr(e){
  const c = (e && e.code) || '';
  const m = {
    'auth/invalid-email':'Invalid email',
    'auth/user-not-found':'No account found',
    'auth/wrong-password':'Wrong password',
    'auth/invalid-credential':'Wrong email or password',
    'auth/email-already-in-use':'Email already in use',
    'auth/weak-password':'Password too weak',
    'auth/network-request-failed':'Network error',
    'auth/popup-closed-by-user':'Popup closed',
    'auth/unauthorized-domain':'Domain not authorized in Firebase',
    'auth/operation-not-allowed':'Enable this sign-in method in Firebase'
  };
  return m[c] || e.message || 'Something went wrong';
}

/* ============================================================
   BOOT
============================================================ */
(async function boot(){
  const t0 = Date.now();
  setLoad(15, 'Starting…');
  await new Promise(r=>setTimeout(r,180));
  setLoad(45, 'Connecting…');

  try { await getRedirectResult(auth); } catch(e){}

  onAuthStateChanged(auth, async (user) => {
    const elapsed = Date.now() - t0;
    const remaining = Math.max(0, 2400 - elapsed);
    setLoad(80, user ? 'Loading your profile…' : 'Preparing login…');
    await new Promise(r=>setTimeout(r, Math.min(remaining, 700)));
    setLoad(100, 'Ready');
    await new Promise(r=>setTimeout(r, 250));
    $('loader').style.opacity = '0';
    setTimeout(()=>{ $('loader').style.display = 'none'; }, 350);

    if (!user){
      ME = null; MEPROF = null;
      $('app').style.display = 'none';
      $('auth').style.display = 'flex';
      return;
    }
    ME = user;
    $('auth').style.display = 'none';
    $('app').style.display = 'flex';
    await ensureProfile(user);
    startPresence();
    watchActiveUsers();
    renderUpload();
    renderProfile();
    go('home');
  });
})();

/* ============================================================
   PROFILE ENSURE
============================================================ */
async function ensureProfile(user){
  const r = ref(db, 'users/'+user.uid);
  const snap = await get(r);
  if (!snap.exists()){
    const nm = user.displayName || (user.email||'').split('@')[0] || 'User';
    await set(r, {
      uid: user.uid,
      email: user.email || '',
      displayName: nm,
      channelName: nm.slice(0,24),
      photoURL: user.photoURL || '',
      bannerURL: '',
      createdAt: Date.now(),
      postCount: 0
    });
  } else {
    const d = snap.val();
    const patch = {};
    if (!d.email && user.email) patch.email = user.email;
    if (!d.photoURL && user.photoURL) patch.photoURL = user.photoURL;
    if (!d.channelName) patch.channelName = user.displayName || 'User';
    if (Object.keys(patch).length) await update(r, patch);
  }
  MEPROF = (await get(r)).val();
}

/* ============================================================
   PRESENCE
============================================================ */
function startPresence(){
  const r = ref(db, 'presence/'+ME.uid);
  const beat = () => set(r, Date.now()).catch(()=>{});
  beat();
  setInterval(beat, 30000);
  window.addEventListener('beforeunload', ()=> set(r, 0));
}
function watchActiveUsers(){
  onValue(ref(db, 'presence'), snap => {
    const now = Date.now();
    let c = 0;
    snap.forEach(ch => { const t = ch.val(); if (t && now - t < 120000) c++; });
    $('activeBadge').style.display = 'flex';
    $('activeCount').textContent = c;
  });
}

/* ============================================================
   NAV
============================================================ */
function go(tab){
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#bottomnav button').forEach(b => b.classList.remove('on'));
  const v = $('view-'+tab);
  if (v) v.classList.add('active');
  const b = document.querySelector(`#bottomnav button[data-tab="${tab}"]`);
  if (b) b.classList.add('on');

  if (tab === 'home') renderHome();
  if (tab === 'profile') renderProfile();
  if (tab === 'history') renderHistory();
  if (tab === 'upload') renderUpload();
  if (tab === 'shorts'){
    watchShorts();
    setTimeout(()=>{
      const f = document.querySelector('.shorts-item video');
      if (f){ f.muted = false; f.play().catch(()=>{ f.muted = true; f.play().catch(()=>{}); }); }
    }, 250);
  } else {
    document.querySelectorAll('.shorts-item video').forEach(v => v.pause());
  }
}
document.querySelectorAll('#bottomnav button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('btnRefresh').onclick = () => { go(currentTab); toast('Refreshed'); };

/* ============================================================
   HOME
============================================================ */
async function fetchAllPosts(limit=100){
  const q = query(ref(db, 'posts'), orderByChild('createdAt'), limitToLast(limit));
  const snap = await get(q);
  const arr = [];
  snap.forEach(ch => arr.push({ id: ch.key, ...ch.val() }));
  return arr.reverse();
}

async function renderHome(){
  const feed = $('feed');
  feed.innerHTML = `<div class="centerSpin"><div class="spin big"></div></div>`;
  try {
    const posts = (await fetchAllPosts()).filter(p => p.type !== 'short');
    posts.forEach(p => postsCache[p.id] = p);
    if (!posts.length){
      feed.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <h3>No posts yet</h3>
        <p>Be the first to post. Tap Upload below.</p>
      </div>`;
      return;
    }
    feed.innerHTML = posts.map(cardHTML).join('');
    attachCardEvents(feed);
  } catch(e){
    feed.innerHTML = `<div class="empty"><h3>Couldn't load</h3><p>${esc(e.message)}</p></div>`;
  }
}

  const liked = p.likes && p.likes[ME.uid];
  const likeCount = Object.keys(p.likes||{}).length;

  }
  return `
  <div class="card" data-id="${p.id}">
    <div class="head">
      <img src="${avatar(p.photoURL, p.channelName)}" onerror="this.src='${avatar('', 'U')}'"/>
      <div>
        <div class="nm">${esc(p.channelName || 'User')}</div>
        <div class="tm">${timeAgo(p.createdAt)} · ${fmt(p.views||0)} views</div>
      </div>
    </div>
    ${media}
    <div class="body">
      <div class="ttl">${esc(p.title||'')}</div>
      ${p.description ? `<div class="dsc">${esc(p.description)}</div>` : ''}
    </div>
    <div class="acts">
      <button data-act="like" class="${liked?'liked':''}">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>

        <span>${fmt(cmtCount)}</span>
      </button>
      <button data-act="share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
        <span>Share</span>

function attachCardEvents(root){
  root.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'like') toggleLike(id, btn);
        if (act === 'comment') openComments(id);
        if (act === 'share') sharePost(id);
      };
    });
  });
}

/* ============================================================
   LIKE
============================================================ */
async function toggleLike(postId, btn){
  const uid = ME.uid;
  const likeRef = ref(db, `posts/${postId}/likes/${uid}`);
  const s = await get(likeRef);
  if (s.exists()){
    await remove(likeRef);
    btn.classList.remove('liked');
    btn.querySelector('svg').setAttribute('fill','none');
  } else {
    await set(likeRef, true);
    btn.classList.add('liked');
    btn.querySelector('svg').setAttribute('fill','currentColor');
  }
  const p = postsCache[postId];
  if (p){
    p.likes = p.likes || {};
    if (s.exists()) delete p.likes[uid]; else p.likes[uid] = true;
    const span = btn.querySelector('span');
    if (span) span.textContent = fmt(Object.keys(p.likes).length);
  }
}

/* ============================================================
   SHARE
============================================================ */
async function sharePost(postId){
  const url = location.origin + location.pathname + '?post=' + postId;
  try {
    if (navigator.share){
      await navigator.share({ title:'ShaheenX', text:'Watch this', url });
    } else {
      await navigator.clipboard.writeText(url);
      toast('Link copied');
    }
  } catch(e){}
}

/* ============================================================
   SHORTS
============================================================ */
let shortsUnsub = null;
function watchShorts(){
  if (shortsUnsub) return;
  const wrap = $('shortsWrap');
  wrap.innerHTML = `<div class="centerSpin" style="height:100%;align-items:center"><div class="spin big"></div></div>`;

  const q = query(ref(db, 'posts'), orderByChild('createdAt'), limitToLast(60));
  shortsUnsub = onValue(q, snap => {
    const arr = [];
    snap.forEach(ch => {
      const v = ch.val();
      if (v.type === 'short') arr.push({ id: ch.key, ...v });
    });
    arr.reverse();
    arr.forEach(p => postsCache[p.id] = p);

    if (!arr.length){
      wrap.innerHTML = `<div class="shorts-item"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
        <h3>No shorts yet</h3><p>Upload the first one!</p>
      </div></div>`;
      return;
    }
    wrap.innerHTML = arr.map(shortHTML).join('');
    bindShorts(wrap);
  });
}

function shortHTML(p){
  const liked = p.likes && p.likes[ME.uid];
  const following = MEPROF?.following && MEPROF.following[p.uid];
  const likeCount = Object.keys(p.likes||{}).length;
  const cmtCount = Object.keys(p.comments||{}).length;
  return `
  <div class="shorts-item" data-id="${p.id}">
    <video src="${p.url}" playsinline loop preload="metadata" poster="${p.thumb||''}" muted></video>
    <div class="gradient"></div>
    <div class="shorts-info">
      <div class="row">
        <img src="${avatar(p.photoURL, p.channelName)}" onerror="this.src='${avatar('', 'U')}'"/>

        ${p.uid !== ME.uid ? `<button data-act="follow" data-uid="${p.uid}" class="${following?'following':''}">${following?'Following':'Follow'}</button>` : ''}
      </div>
      <div class="ttl">${esc(p.title||'')}</div>
      ${p.description ? `<div class="dsc">${esc(p.description)}</div>` : ''}
    </div>
    <div class="shorts-side">
      <button data-act="like" class="${liked?'liked':''}">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span>${fmt(likeCount)}</span>
      </button>
      <button data-act="comment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3z"/></svg>
        <span>${fmt(cmtCount)}</span>
      </button>
      <button data-act="share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
        <span>Share</span>
      </button>
      <button data-act="save">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>Save</span>
      </button>
    </div>
  </div>`;
}

function bindShorts(wrap){
  if (shortsObserver) shortsObserver.disconnect();
  shortsObserver = new IntersectionObserver(entries => {
    entries.forEach(async e => {
      const item = e.target;
      const vid = item.querySelector('video');
      const id = item.dataset.id;
      if (e.isIntersecting && e.intersectionRatio > 0.6){
        document.querySelectorAll('.shorts-item video').forEach(v => { if (v !== vid) v.pause(); });
        vid.muted = false;
        try { await vid.play(); } catch(err){ vid.muted = true; await vid.play().catch(()=>{}); }
        markHistory(id);
        startViewTimer(id);
      } else {
        vid.pause();
        stopViewTimer(id);
      }
    });
  }, { threshold: [0.15, 0.6, 1], root: wrap });

  wrap.querySelectorAll('.shorts-item').forEach(it => shortsObserver.observe(it));

  wrap.querySelectorAll('.shorts-item').forEach(item => {
    const id = item.dataset.id;
    const vid = item.querySelector('video');
    item.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const pp = $('playPauseOverlay');
      const logo = pp.querySelector('svg');
      if (vid.paused){
        vid.play();
        logo.innerHTML = '<path d="M8 5v14l11-7z"/>';
        pp.classList.add('show');
        setTimeout(()=>pp.classList.remove('show'), 420);
      } else {
        vid.pause();
        logo.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
        pp.classList.add('show');
      }
    });
    item.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'like') await toggleShortLike(id, btn);
        if (act === 'comment') openComments(id);
        if (act === 'share') sharePost(id);
        if (act === 'save') toast('Saved');
        if (act === 'follow') await toggleFollow(btn.dataset.uid, btn);
      };
    });
  });
}

async function toggleShortLike(postId, btn){
  const uid = ME.uid;
  const r = ref(db, `posts/${postId}/likes/${uid}`);
  const s = await get(r);
  if (s.exists()){
    await remove(r);
    btn.classList.remove('liked');
    btn.querySelector('svg').setAttribute('fill','none');
  } else {
    await set(r, true);
    btn.classList.add('liked');
    btn.querySelector('svg').setAttribute('fill','currentColor');
  }
  const p = postsCache[postId];
  if (p){
    p.likes = p.likes || {};
    if (s.exists()) delete p.likes[uid]; else p.likes[uid] = true;
    btn.querySelector('span').textContent = fmt(Object.keys(p.likes).length);
  }
}

function startViewTimer(id){
  if (viewTimers[id]) return;
  viewTimers[id] = setTimeout(async () => {
    try {
      const vr = ref(db, `views/${id}/${ME.uid}`);
      const s = await get(vr);
      if (s.exists()) return;
      await set(vr, Date.now());
      await runTransaction(ref(db, `posts/${id}/views`), c => (c||0)+1);
    } catch(e){}
  }, 5000);
}
function stopViewTimer(id){ if (viewTimers[id]){ clearTimeout(viewTimers[id]); delete viewTimers[id]; } }

============================================================ */
async function toggleFollow(targetUid, btn){
  if (!targetUid || targetUid === ME.uid) return;
  const myRef = ref(db, `users/${ME.uid}/following/${targetUid}`);
  const theirRef = ref(db, `users/${targetUid}/followers/${ME.uid}`);
  const s = await get(myRef);
  if (s.exists()){
    await remove(myRef);
    await remove(theirRef);
    btn.classList.remove('following');
    btn.textContent = 'Follow';
    if (MEPROF?.following) delete MEPROF.following[targetUid];
  } else {
    await set(myRef, true);
    await set(theirRef, true);
    btn.classList.add('following');
    btn.textContent = 'Following';
    MEPROF.following = MEPROF.following || {};
    MEPROF.following[targetUid] = true;
  }
}

function openComments(postId){

async function renderComments(postId){
  const list = $('cmtList');
  list.innerHTML = `<div class="centerSpin"><div class="spin"></div></div>`;
  const s = await get(ref(db, `posts/${postId}/comments`));
  const arr = [];
  s.forEach(ch => arr.push({ id: ch.key, ...ch.val() }));
  arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  if (!arr.length){ list.innerHTML = `<div class="empty"><p>No comments yet. Be the first!</p></div>`; return; }

  list.innerHTML = arr.map(c => commentHTML(c)).join('');

  list.querySelectorAll('[data-cmt-like]').forEach(b => {
    b.onclick = async () => {
      const cid = b.dataset.cmtLike;
      const lr = ref(db, `posts/${postId}/comments/${cid}/likes/${ME.uid}`);
      const s2 = await get(lr);
      if (s2.exists()) await remove(lr); else await set(lr, true);
      renderComments(postId);
    };
  });
  list.querySelectorAll('[data-cmt-reply]').forEach(b => {
    b.onclick = async () => {
      const cid = b.dataset.cmtReply;
      const text = prompt('Reply (max 50 chars)');
      if (!text) return;
      const t = text.slice(0,50);
      const rr = push(ref(db, `posts/${postId}/comments/${cid}/replies`));
      await set(rr, {
        uid: ME.uid,
        name: MEPROF.channelName || MEPROF.displayName || 'User',
        photoURL: MEPROF.photoURL || '',
        text: t,
        createdAt: Date.now()
      });
      renderComments(postId);
    };
  });
}

function commentHTML(c){
  const likes = Object.keys(c.likes||{}).length;
  const liked = c.likes && c.likes[ME.uid];
  const replies = c.replies ? Object.entries(c.replies).map(([k,v]) => ({id:k,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)) : [];
  return `
  <div class="cmt">
    <img src="${avatar(c.photoURL, c.name)}" onerror="this.src='${avatar('', 'U')}'"/>
    <div class="cbody">
      <div class="cnm">${esc(c.name||'User')}</div>
      <div class="ctx">${esc(c.text||'')}</div>
      <div class="cmeta">
        <button data-cmt-like="${c.id}" class="${liked?'liked':''}">♥ ${likes}</button>
        <button data-cmt-reply="${c.id}">Reply</button>
        <span>${timeAgo(c.createdAt)}</span>
      </div>
      ${replies.length ? `<div class="replies">${replies.map(r => `
        <div class="cmt">
          <img src="${avatar(r.photoURL, r.name)}" onerror="this.src='${avatar('', 'U')}'"/>
          <div class="cbody">
            <div class="cnm">${esc(r.name||'User')}</div>
            <div class="ctx">${esc(r.text||'')}</div>
          </div>
        </div>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

$('cmtSend').onclick = async () => {
  if (!currentCmtPost) return;
  const inp = $('cmtInput');
  const text = inp.value.trim().slice(0,50);
  if (!text) return;
  const postId = currentCmtPost;
  const s = await get(ref(db, `posts/${postId}/comments`));
  let mine = 0;
  s.forEach(ch => { if (ch.val().uid === ME.uid) mine++; });
  if (mine >= 3) return toast('Max 3 comments per post');
  const nr = push(ref(db, `posts/${postId}/comments`));
  await set(nr, {
    uid: ME.uid,
    name: MEPROF.channelName || MEPROF.displayName || 'User',
    photoURL: MEPROF.photoURL || '',
    text,
    createdAt: Date.now()
  });
  inp.value = '';
  renderComments(postId);
};

============================================================ */
let uplType = 'short';
let uplFile = null;
function renderUpload(){
  const w = $('uplWrap');
  w.innerHTML = `
    <div class="tabs">
      <button data-t="short" class="${uplType==='short'?'on':''}">Short</button>
      <button data-t="video" class="${uplType==='video'?'on':''}">Video</button>
      <button data-t="image" class="${uplType==='image'?'on':''}">Image</button>
    </div>
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
      <p id="dropTitle">Tap to select ${uplType==='image'?'an image':'a video'}</p>
      <small>${uplType==='short'?'Vertical · up to 30 min':'From your gallery · up to 30 min'}</small>
    </div>
    <input id="fileInput" type="file" accept="${uplType==='image'?'image/*':'video/*'}" style="display:none"/>
    <div id="prevWrap"></div>
    <label>Title <span id="cTitleL">0/50</span></label>
    <input type="text" id="tTitle" maxlength="50" placeholder="Give it a title…"/>
    <label>Description <span id="cDescL">0/100</span></label>
    <textarea id="tDesc" rows="3" maxlength="100" placeholder="Say something…"></textarea>
    <button class="submit" id="btnUpload">Upload ${uplType[0].toUpperCase()+uplType.slice(1)}</button>
    <div class="progress" id="prog">
      <div class="track"><i id="progBar"></i></div>
      <div class="lbl"><span id="progTxt">Uploading…</span><b id="progPct">0%</b></div>
    </div>
  `;
  w.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => { uplType = b.dataset.t; uplFile = null; renderUpload(); };
  });
  const drop = $('drop');
  const fi = $('fileInput');
  drop.onclick = () => fi.click();
  fi.onchange = () => {
    const f = fi.files[0];
    if (!f) return;
    if (uplType !== 'image' && f.size > 800 * 1024 * 1024) return toast('Max 800MB');
    uplFile = f;
    const url = URL.createObjectURL(f);
    $('prevWrap').innerHTML = uplType==='image'
      ? `<img class="prev" src="${url}"/>`
      : `<video class="prev" src="${url}" controls playsinline></video>`;
    $('dropTitle').textContent = 'Change file';
    $('drop').querySelector('small').textContent = f.name.slice(0,40);
  };
  $('tTitle').oninput = e => $('cTitleL').textContent = `${e.target.value.length}/50`;
  $('tDesc').oninput = e => $('cDescL').textContent = `${e.target.value.length}/100`;
  $('btnUpload').onclick = doUpload;
}

async function doUpload(){
  const title = $('tTitle').value.trim();
  const desc = $('tDesc').value.trim();
  if (!uplFile) return toast('Select a file first');
  if (!title) return toast('Title is required');

  $('btnUpload').disabled = true;
  $('prog').classList.add('show');
  setProg(0, 'Preparing…');

  try {
    const rType = uplType === 'image' ? 'image' : 'video';
    const url = await cloudinaryUpload(uplFile, rType, (pct, secsLeft) => {
      if (pct < 99){
        const s = secsLeft > 0 ? ` · ${secsLeft}s left` : '';
        setProg(pct, `Uploading${s}`);
      } else {
        setProg(99, 'Processing…');
      }
    });

    setProg(100, 'Saving…');
    const thumb = rType === 'video'
      ? url.replace('/upload/', '/upload/so_0/').replace(/\.(mp4|mov|webm|m4v|avi|mkv)$/i, '.jpg')
      : url;

    const postRef = push(ref(db, 'posts'));
    await set(postRef, {
      id: postRef.key,
      uid: ME.uid,
      displayName: MEPROF.displayName || '',
      channelName: MEPROF.channelName || MEPROF.displayName || 'User',
      photoURL: MEPROF.photoURL || '',
      type: uplType,
      url,
      thumb,
      title,
      description: desc,
      createdAt: Date.now(),
      views: 0,
      likes: {},
      comments: {}
    });
    await update(ref(db, 'users/'+ME.uid), { postCount: increment(1) });

    toast('Uploaded 🎉');
    uplFile = null;
    renderUpload();
    if (MEPROF) MEPROF.postCount = (MEPROF.postCount||0)+1;
    if (uplType === 'short') go('shorts');
    else go('home');
  } catch(e){
    console.error(e);
    toast('Failed: ' + (e.message || 'try again'));
    $('btnUpload').disabled = false;
    $('prog').classList.remove('show');
  }
}

function setProg(pct, txt){
  $('progBar').style.width = pct + '%';
  $('progPct').textContent = Math.round(pct) + '%';
  if (txt) $('progTxt').textContent = txt;
}

function cloudinaryUpload(file, resourceType, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fd.append('folder', 'shaheenx');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`);
    const t0 = Date.now();
    xhr.upload.onprogress = e => {
      if (e.lengthComputable){
        const pct = (e.loaded / e.total) * 100;
        const elapsed = (Date.now() - t0) / 1000;
        const speed = e.loaded / Math.max(elapsed, 0.1);
        const left = Math.max(0, Math.round((e.total - e.loaded) / Math.max(speed, 1)));
        onProgress(pct, left);
      }
    };
    xhr.onload = () => {
      try {
        const d = JSON.parse(xhr.responseText);
        if (d.secure_url) resolve(d.secure_url);
        else reject(new Error(d.error?.message || 'Upload failed'));
      } catch(e){ reject(new Error('Bad response — check your Cloudinary preset')); }
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send(fd);
  });
}

  }
  feed.innerHTML = posts.map(cardHTML).join('');
  attachCardEvents(feed);
}

async function renderProfContent(tab){
  const c = $('profContent');
  if (!c) return;
  c.innerHTML = `<div class="centerSpin"><div class="spin"></div></div>`;

  if (tab === 'about'){
    c.innerHTML = `
      <div style="padding:18px;font-size:13.5px;line-height:1.9;color:#ccc">
        <div><b style="color:#fff">Channel:</b> ${esc(MEPROF.channelName||'')}</div>
        <div><b style="color:#fff">Email:</b> ${esc(MEPROF.email||'')}</div>
        <div><b style="color:#fff">Joined:</b> ${new Date(MEPROF.createdAt||Date.now()).toLocaleDateString()}</div>
      </div>`;
    return;
  }

  const q = query(ref(db, 'posts'), orderByChild('createdAt'), limitToLast(150));
  const s = await get(q);
  const mine = [];
  s.forEach(ch => {
    const v = ch.val();
    if (v.uid === ME.uid){
      if (tab === 'shorts' && v.type === 'short') mine.push({ id: ch.key, ...v });
      if (tab === 'posts' && v.type !== 'short') mine.push({ id: ch.key, ...v });
    }
  });
  mine.reverse();

  if (!mine.length){ c.innerHTML = `<div class="empty"><p>No ${tab} yet.</p></div>`; return; }

  c.innerHTML = `<div class="grid">${mine.map(p => `
    <div class="cell">
      ${p.type==='image'
        ? `<img src="${p.url}" loading="lazy"/>`
        : `<video src="${p.url}" muted playsinline preload="metadata" poster="${p.thumb||''}"></video>`}
      <div class="cnt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 3l14 9-14 9z" fill="currentColor" stroke="none"/></svg>${fmt(p.views||0)}</div>
    </div>`).join('')}</div>`;
}

function pickProfilePic(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast('Uploading…');
    try {
      const url = await cloudinaryUpload(f, 'image', ()=>{});
      await update(ref(db, 'users/'+ME.uid), { photoURL: url });
      try { await updateProfile(ME, { photoURL: url }); } catch(e){}
      MEPROF.photoURL = url;
      toast('Profile picture updated ✅');
      renderProfile();
    } catch(e){ toast('Failed: '+e.message); }
  };
  inp.click();
}

function pickBanner(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
