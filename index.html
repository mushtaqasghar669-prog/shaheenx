<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaheenX Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhLi_9NuD1Zh-5o4NYen8GT9i0xwZaz_U",
            authDomain: "shaheenx-7d9ab.firebaseapp.com",
            databaseURL: "https://shaheenx-7d9ab-default-rtdb.firebaseio.com",
            projectId: "shaheenx-7d9ab",
            storageBucket: "shaheenx-7d9ab.firebasestorage.app",
            messagingSenderId: "532384586851",
            appId: "1:532384586851:web:522bfa338a1b346846ec56",
            measurementId: "G-1JNEYM433J"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
    </script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-black text-white pb-20">

    <!-- Loading & Auth Screen -->
    <div id="loaderScreen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6">
        <h1 class="text-3xl font-bold text-red-600 mb-4">SHAHEEN X ULTRA</h1>
        <p id="loaderText" class="text-gray-400 mb-6">Checking session...</p>
        <div id="authBox" class="w-full max-w-sm bg-zinc-900 p-6 rounded-2xl border border-zinc-800 hide">
            <h2 class="text-xl font-bold mb-4 text-center">Login / Register</h2>
            <input type="email" id="userEmail" placeholder="Enter Email" class="w-full bg-zinc-800 p-3 rounded-lg mb-3 border border-zinc-700 text-white">
            <input type="password" id="userPass" placeholder="Enter Password" class="w-full bg-zinc-800 p-3 rounded-lg mb-4 border border-zinc-700 text-white">
            <button onclick="handleAuth()" class="w-full bg-red-600 py-3 rounded-lg font-bold hover:bg-red-700 transition">Continue</button>
        </div>
    </div>

    <!-- Top Header -->
    <header class="flex justify-between items-center px-4 py-3 border-b border-zinc-800 sticky top-0 bg-black/90 z-40 backdrop-blur">
        <h1 class="text-xl font-black tracking-wider text-red-600">SHAHEENX</h1>
        <div class="flex items-center gap-3">
            <button onclick="refreshFeed()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-rotate"></i></button>
            <div id="userAvatarHeader" class="w-8 h-8 rounded-full bg-zinc-700 overflow-hidden flex items-center justify-center font-bold">A</div>
        </div>
    </header>

    <!-- Main Content Sections -->
    <main id="mainContainer">
        <!-- HOME SECTION -->
        <section id="section-home" class="p-4">
            <div class="mb-4">
                <h3 class="text-sm font-semibold text-zinc-400 mb-2">Active Users</h3>
                <div id="activeUsersList" class="flex gap-3 overflow-x-auto pb-2"></div>
            </div>
            <div id="homeFeed" class="space-y-4"></div>
        </section>

        <!-- SHORTS SECTION -->
        <section id="section-shorts" class="hide h-[calc(100vh-120px)] overflow-y-scroll snap-y snap-mandatory"></section>

        <!-- UPLOAD SECTION -->
        <section id="section-upload" class="hide p-4 max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4">Upload Content</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-zinc-400">Content Type</label>
                    <select id="upType" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl mt-1">
                        <option value="post">Image / Text Post</option>
                        <option value="short">Short Video (Max 30 mins)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Title (Max 50 chars)</label>
                    <input type="text" id="upTitle" maxlength="50" oninput="updateCharCount(this, 'titleCount', 50)" placeholder="Enter title..." class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl mt-1">
                    <span id="titleCount" class="text-[10px] text-zinc-500 float-right">0/50</span>
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Description (Max 100 chars)</label>
                    <textarea id="upDesc" maxlength="100" oninput="updateCharCount(this, 'descCount', 100)" placeholder="Enter description..." class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl mt-1 h-20"></textarea>
                    <span id="descCount" class="text-[10px] text-zinc-500 float-right">0/100</span>
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Choose Media File</label>
                    <input type="file" id="upFile" accept="image/*,video/*" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl mt-1 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-red-600 file:text-white">
                </div>
                <div id="uploadProgressContainer" class="hide">
                    <div class="w-full bg-zinc-800 rounded-full h-2.5">
                        <div id="uploadProgressBar" class="bg-red-600 h-2.5 rounded-full w-0 transition-all"></div>
                    </div>
                    <p id="uploadProgressText" class="text-xs text-center text-zinc-400 mt-1">Compressing & Uploading...</p>
                </div>
                <button onclick="uploadContent()" class="w-full bg-red-600 py-3 rounded-xl font-bold hover:bg-red-700 transition">Publish Now</button>
            </div>
        </section>

        <!-- PROFILE SECTION -->
        <section id="section-profile" class="hide p-4 max-w-md mx-auto text-center">
            <div class="relative w-24 h-24 mx-auto rounded-full overflow-hidden border-2 border-red-600 mb-3 bg-zinc-800">
                <img id="profileAvatarImg" src="" class="w-full h-full object-cover hide">
                <span id="profileAvatarInitial" class="text-3xl font-bold flex items-center justify-center h-full">A</span>
            </div>
            <h2 id="profileName" class="text-lg font-bold">Abdul Basit Mushtaq</h2>
            <p id="profileEmail" class="text-xs text-zinc-400 mb-4">user@shaheenx.app</p>
            
            <div class="flex justify-center gap-6 mb-6 bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                <div><span id="statPosts" class="block font-bold">0</span><span class="text-[10px] text-zinc-400">Posts</span></div>
                <div><span id="statFollowers" class="block font-bold">0</span><span class="text-[10px] text-zinc-400">Followers</span></div>
                <div><span id="statFollowing" class="block font-bold">0</span><span class="text-[10px] text-zinc-400">Following</span></div>
            </div>

            <div class="space-y-3 text-left">
                <input type="text" id="editUsername" placeholder="Update Channel Name" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl">
                <button onclick="updateProfileName()" class="w-full bg-zinc-800 py-2.5 rounded-xl font-semibold text-sm hover:bg-zinc-700">Save Profile Name</button>
                <button onclick="switchAccount()" class="w-full bg-red-600/20 text-red-500 border border-red-600/30 py-2.5 rounded-xl font-semibold text-sm">Switch Account / Logout</button>
            </div>
        </section>

        <!-- HISTORY SECTION -->
        <section id="section-history" class="hide p-4">
            <h2 class="text-xl font-bold mb-4">Watch History</h2>
            <div id="historyList" class="space-y-3"></div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-800 flex justify-around py-3 z-40">
        <button onclick="switchTab('home')" class="nav-btn text-red-600 flex flex-col items-center"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px]">Home</span></button>
        <button onclick="switchTab('shorts')" class="nav-btn text-zinc-400 flex flex-col items-center"><i class="fa-solid fa-bolt text-lg"></i><span class="text-[10px]">Shorts</span></button>
        <button onclick="switchTab('upload')" class="nav-btn text-zinc-400 flex flex-col items-center"><i class="fa-solid fa-circle-plus text-lg"></i><span class="text-[10px]">Upload</span></button>
        <button onclick="switchTab('profile')" class="nav-btn text-zinc-400 flex flex-col items-center"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px]">Profile</span></button>
        <button onclick="switchTab('history')" class="nav-btn text-zinc-400 flex flex-col items-center"><i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[10px]">History</span></button>
    </nav>

    <script>
        let currentUser = { uid: "user_" + Math.random().toString(36.substring(7)), name: "Abdul Basit Mushtaq", email: "abdulbasit@shaheenx.app" };

        function initApp() {
            setTimeout(() => {
                document.getElementById('loaderScreen').classList.add('hide');
                loadFeed();
            }, 1000);
        }

        function switchTab(tabName) {
            ['home', 'shorts', 'upload', 'profile', 'history'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hide');
            });
            document.getElementById(`section-${tabName}`).classList.remove('hide');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-red-600', 'text-zinc-400'));
            event.currentTarget.classList.replace('text-zinc-400', 'text-red-600');
            
            if(tabName === 'shorts') loadShorts();
        }

        function updateCharCount(el, countId, max) {
            document.getElementById(countId).innerText = `${el.value.length}/${max}`;
        }

        function uploadContent() {
            const title = document.getElementById('upTitle').value;
            const desc = document.getElementById('upDesc').value;
            const type = document.getElementById('upType').value;
            const fileInput = document.getElementById('upFile');

            if(!title) { alert("Please enter a title"); return; }

            document.getElementById('uploadProgressContainer').classList.remove('hide');
            let progress = 0;
            let interval = setInterval(() => {
                progress += 20;
                document.getElementById('uploadProgressBar').style.width = progress + '%';
                if(progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        alert("Uploaded Successfully!");
                        document.getElementById('uploadProgressContainer').classList.add('hide');
                        document.getElementById('uploadProgressBar').style.width = '0%';
                        document.getElementById('upTitle').value = '';
                        document.getElementById('upDesc').value = '';
                        document.getElementById('upFile').value = '';
                        switchTab('home');
                        loadFeed();
                    }, 500);
                }
            }, 300);
        }

        function loadFeed() {
            const feed = document.getElementById('homeFeed');
            feed.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold">A</div>
                            <div>
                                <h4 class="font-bold text-sm">Abdul Basit Mushtaq</h4>
                                <span class="text-[10px] text-zinc-400">Just now</span>
                            </div>
                        </div>
                        <button onclick="toggleFollow(this)" class="bg-red-600 text-xs px-3 py-1.5 rounded-full font-semibold">Follow</button>
                    </div>
                    <p class="text-sm mb-3">ShaheenX Ultra App is live and fully working with high performance!</p>
                    <div class="bg-zinc-950 h-48 rounded-xl flex items-center justify-center text-zinc-600 border border-zinc-800">
                        <i class="fa-solid fa-play text-3xl text-zinc-500"></i>
                    </div>
                    <div class="flex justify-between items-center mt-3 text-zinc-400 text-sm">
                        <button onclick="likePost(this)"><i class="fa-regular fa-heart"></i> <span class="like-count">12</span></button>
                        <button><i class="fa-regular fa-comment"></i> 3</button>
                        <button><i class="fa-solid fa-share"></i> Share</button>
                    </div>
                </div>
            `;
        }

        function loadShorts() {
            const shortsSec = document.getElementById('section-shorts');
            shortsSec.innerHTML = `
                <div class="h-full w-full snap-start relative flex flex-col justify-end p-4 bg-zinc-900 border-b border-zinc-800">
                    <div class="absolute inset-0 flex items-center justify-center text-zinc-700">
                        <i class="fa-solid fa-video text-5xl"></i>
                    </div>
                    <div class="relative z-10 mb-6">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-9 h-9 rounded-full bg-red-600 flex items-center justify-center font-bold text-sm">A</div>
                            <span class="font-bold text-sm">Abdul Basit Mushtaq</span>
                            <button class="bg-red-600 text-xs px-2.5 py-1 rounded-full">Follow</button>
                        </div>
                        <p class="text-sm mb-1">Amazing short video demo!</p>
                    </div>
                    <div class="absolute right-4 bottom-20 flex flex-col gap-4 items-center z-10">
                        <button onclick="likeShort(this)" class="text-2xl"><i class="fa-solid fa-heart text-white"></i><span class="block text-[10px]">24</span></button>
                        <button class="text-2xl"><i class="fa-solid fa-comment"></i><span class="block text-[10px]">3</span></button>
                        <button class="text-2xl"><i class="fa-solid fa-share"></i><span class="block text-[10px]">Share</span></button>
                    </div>
                </div>
            `;
        }

        function toggleFollow(btn) {
            if(btn.innerText === "Follow") {
                btn.innerText = "Following";
                btn.classList.replace("bg-red-600", "bg-zinc-800");
            } else {
                btn.innerText = "Follow";
                btn.classList.replace("bg-zinc-800", "bg-red-600");
            }
        }

        function likePost(btn) {
            let icon = btn.querySelector('i');
            let countSpan = btn.querySelector('.like-count');
            if(icon.classList.contains('fa-regular')) {
                icon.classList.replace('fa-regular', 'fa-solid');
                icon.style.color = 'red';
                countSpan.innerText = parseInt(countSpan.innerText) + 1;
            } else {
                icon.classList.replace('fa-solid', 'fa-regular');
                icon.style.color = '';
                countSpan.innerText = parseInt(countSpan.innerText) - 1;
            }
        }

        function updateProfileName() {
            let newName = document.getElementById('editUsername').value;
            if(newName) {
                document.getElementById('profileName').innerText = newName;
                alert("Profile name updated successfully!");
            }
        }

        function switchAccount() {
            alert("Switch account popup triggered.");
        }

        window.onload = initApp;
    </script>
</body>
</html>
