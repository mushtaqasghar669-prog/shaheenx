function chunkSend(blob,s,e,total,id,rt,name,onb){return new Promise((ok,no)=>{

  x.setRequestHeader("X-Unique-Upload-Id",id);x.setRequestHeader("Content-Range",`bytes ${s}-${e}/${total}`);
  x.upload.onprogress=ev=>ev.lengthComputable&&onb(Math.min(blob.size,ev.loaded));
  x.onload=()=>{let r={};try{r=JSON.parse(x.responseText)}catch(_){}
   if(x.status===200)return ok(r);
   if(x.status>=500&&++tries<4)return setTimeout(go1,1500*tries);no(new Error(r.error?.message||"Server error "+x.status))};
  x.onerror=()=>{if(++tries<4)setTimeout(go1,1500*tries);else no(new Error("Connection lost, check your internet"))};x.send(fd)};go1()})}

 <div style="text-align:center;margin-top:8px"><b style="font-size:19px">${esc(U.name)}</b>${U.bio?`<div class="pill" style="margin-top:4px;padding:0 24px">${esc(U.bio)}</div>`:""}</div>
 <div class="stats"><div><b>${mine.length}</b><br><span class="pill">Posts</span></div><div data-ls="followers"><b>${fr}</b><br><span class="pill">Followers</span></div><div data-ls="following"><b>${fg}</b><br><span class="pill">Following</span></div></div>
 <div class="pill" style="text-align:center;margin-bottom:10px">❤ ${lk} likes · 👁 ${vw} views</div>
 <div style="padding:0 16px">${own?'<button class="btn g" id="dots">⋯ Settings</button>':`<button class="btn ${FW[uid]?"g ":""}" data-f="${uid}">${FW[uid]?"Following":"Follow"}</button>`}</div>
 <div class="tabs">${tabs.map(t=>`<button class="btn ${ptab===t?"":"g"} s" data-pt="${t}">${TL[t]}</button>`).join("")}</div>
 ${l.length?'<div class="grid">'+l.map(p=>`<div data-id="${p.id}"><img src="${esc(thumb(p))}" loading="lazy">${own&&ptab!=="saved"?`<button class="x" data-del="${p.id}">🗑</button>`:""}</div>`).join("")+"</div>":'<div class="empty">Nothing here yet</div>'}`;
 if(own)$("#dots").onclick=menu;else $("#bk").onclick=()=>go(lastTab);
 m.querySelectorAll("[data-ls]").forEach(d=>d.onclick=()=>{const k2=d.dataset.ls;if(own||pr[k2==="followers"?"fr":"fg"]!==false)listUsers(uid,k2);else toast("This user keeps this list private")});
 m.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{ptab=b.dataset.pt;prof(m,uid)});
 m.querySelectorAll(".grid div").forEach(d=>d.onclick=e=>{if(e.target.dataset.del)return;openPost(PM[d.dataset.id])});
 m.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this post?"))return;const id=b.dataset.del;await D.remove(R("posts/"+id));await D.remove(R("comments/"+id));await D.remove(R("views/"+id));go("me")});
 bindF(m)}
function menu(){const s=$("#sheet");s.hidden=false;const pr=P.priv||{};
 s.innerHTML=`<div><button class="btn g" id="cn">✏️ Change channel name</button><button class="btn g" id="bio">📝 Edit bio</button><button class="btn g" id="cp">📷 Change your profile picture</button><button class="btn g" id="cb">🖼 Update banner</button>
 <button class="btn g" id="pfr">👥 Followers list: ${pr.fr===false?"Private":"Public"}</button><button class="btn g" id="pfg">👤 Following list: ${pr.fg===false?"Private":"Public"}</button>
 <button class="btn g" id="nt">🔔 New post alerts: ${P.notif===false?"Off":"On"}</button>
 <button class="btn g" id="sw">🔁 Switch account</button><button class="btn g" id="ad">➕ Add account</button><button class="btn g" id="lo">Log out</button><button class="btn g" id="x">Close</button>
 <input id="pf" type="file" accept="image/*" hidden></div>`;
 $("#x").onclick=()=>s.hidden=true;
 const tog=k=>async()=>{P.priv={...(P.priv||{}),[k]:(P.priv||{})[k]===false};await D.update(R("users/"+me.uid+"/priv"),P.priv);menu()};
 $("#pfr").onclick=tog("fr");$("#pfg").onclick=tog("fg");
 $("#nt").onclick=async()=>{const on=P.notif===false;P.notif=on;await D.update(R("users/"+me.uid),{notif:on});
  if(on&&window.Notification&&Notification.permission==="default")await Notification.requestPermission();menu()};
 $("#cn").onclick=async()=>{const n=(prompt("Channel name (max 30 characters)",P.name)||"").trim().slice(0,30);if(!n)return;if(dirty(n))return warn();P.name=n;await D.update(R("users/"+me.uid),{name:n});s.hidden=true;toast("Channel name updated");go("me")};
 $("#bio").onclick=async()=>{const b=(prompt("Bio (max 80 characters)",P.bio||"")||"").trim().slice(0,80);if(dirty(b))return warn();P.bio=b;await D.update(R("users/"+me.uid),{bio:b});s.hidden=true;toast("Bio updated");go("me")};
 const pick=key=>{const i=$("#pf");i.onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("Uploading…");
  try{const r=await plainUpload(f);if(rejected(r))return warn();
   const u=key==="photo"?r.secure_url.replace("/upload/","/upload/c_fill,g_face,w_400,h_400,q_auto/"):r.secure_url.replace("/upload/","/upload/c_fill,w_1200,h_400,q_auto/");
   P[key]=u;await D.update(R("users/"+me.uid),{[key]:u});s.hidden=true;toast("Saved ✅");go("me")}catch(err){toast("Failed: "+err.message)}};i.click()};
 $("#cp").onclick=()=>pick("photo");$("#cb").onclick=()=>pick("banner");
 const out=()=>{s.hidden=true;logout()};$("#sw").onclick=out;$("#ad").onclick=out;$("#lo").onclick=out}
</script></body></html>
