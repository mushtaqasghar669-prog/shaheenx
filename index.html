<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shaheen X</title>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhLi_9NuD1Zh-5o4NYen8GT9i0xwZaz_U",
            authDomain: "shaheenx-7d9ab.firebaseapp.com",
            databaseURL: "https://shaheenx-7d9ab-default-rtdb.firebaseio.com",
            projectId: "shaheenx-7d9ab",
            storageBucket: "shaheenx-7d9ab.firebasestorage.app",
            messagingSenderId: "532384586851",
            appId: "1:532384586851:web:522bfa338a1b346846ec56"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.auth = auth;
        window.provider = new GoogleAuthProvider();
    </script>

    <style>
        /* Blogger elements hide logic */
        header, footer, .sidebar, .widget, .post-header, .post-footer { display: none !important; }
        
        /* Ultra App Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; }

        /* Loading Screen */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.5s; }
        .spinner { border: 4px solid #333; border-top: 4px solid #e50914; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Screens Management */
        .app-screen { display: none; width: 100%; height: calc(100vh - 60px); overflow-y: auto; overflow-x: hidden; }
        .app-screen.active { display: block; }

        /* TikTok Style Shorts UI */
        #shorts-screen { position: relative; background: #000; height: calc(100vh - 60px); }
        .video-container { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay { position: absolute; bottom: 20px; left: 15px; right: 70px; }
        .channel-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px;}
        .video-title { font-size: 14px; margin-bottom: 5px; }
        
        .side-buttons { position: absolute; bottom: 20px; right: 15px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .profile-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        .action-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;}
        .action-text { font-size: 12px; }
        
        .follow-btn { background: #e50914; color: white; border: none; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer;}

        /* Upload Screen UI */
        #upload-screen { padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-top: 50px; }
        .input-box { background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none;}
        .upload-btn { background: #e50914; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        #progress-bar-container { display: none; width: 100%; height: 10px; background: #222; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: #e50914; transition: width 0.3s; }

        /* Profile Screen */
        .profile-header { text-align: center; padding: 20px; }
        .banner { width: 100%; height: 120px; background: #333; object-fit: cover; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #000; margin-top: -45px; object-fit: cover; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-top: 15px; font-weight: bold; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #0a0a0a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #888; text-decoration: none; font-size: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Loading Screen (3 Seconds Max) -->
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="app-screen">
        <h2 style="padding: 20px; text-align: center;">Shaheen X - Home</h2>
        <p style="text-align: center; color: #888;">Active Users: <span style="color:#0f0;">1,204</span></p>
    </div>

    <!-- Shorts Screen (Full Focus) -->
    <div id="shorts-screen" class="app-screen active">
        <div class="video-container">
            <!-- Dummy Video for testing UI -->
            <video id="main-video" loop autoplay muted>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
            
            <div class="video-overlay">
                <div class="channel-name">@AbdulBasit <button class="follow-btn">S-Follow</button></div>
                <div class="video-title">Shaheen AI Test Video #ShaheenX</div>
            </div>

            <div class="side-buttons">
                <div class="profile-btn"><img src="https://ui-avatars.com/api/?name=Abdul+Basit&background=random" alt="Profile"></div>
                <button class="action-btn" onclick="toggleLike(this)">🤍<span class="action-text">1.2M</span></button>
                <button class="action-btn">💬<span class="action-text">Comments</span></button>
                <button class="action-btn">↪️<span class="action-text">Share</span></button>
            </div>
            
            <!-- Pause/Play Shaheen Logo Overlay (Hidden by default) -->
            <div id="play-pause-logo" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; opacity: 0.7;">🦅</div>
        </div>
    </div>

    <!-- Upload Screen -->
    <div id="upload-screen" class="app-screen">
        <h2 style="text-align: center;">Upload Video</h2>
        <input type="text" id="video-title" class="input-box" placeholder="Title (Max 50 letters)" maxlength="50" oninput="updateCount('title-count', this.value.length, 50)">
        <small id="title-count" style="color: #888; text-align: right;">0/50</small>

        <textarea id="video-desc" class="input-box" placeholder="Description (Max 100 letters)" maxlength="100" rows="3"></textarea>

        <input type="file" id="video-file" class="input-box" accept="video/*" style="display: none;">
        <button class="upload-btn" style="background: #333;" onclick="document.getElementById('video-file').click()">🎥 Choose Professional Video</button>
        
        <button class="upload-btn" onclick="startUpload()">🚀 Upload Now</button>

        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <p id="upload-status" style="text-align: center; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="app-screen">
        <img src="https://via.placeholder.com/600x200/333/fff?text=Shaheen+Banner" class="banner" alt="Banner">
        <div class="profile-header">
            <img src="https://ui-avatars.com/api/?name=Abdul+Basit&background=random" class="profile-avatar" alt="User">
            <h2>Abdul Basit</h2>
            <p>@abdulbasit_shaheen</p>
            <div class="stats">
                <div><span>10K</span><br><small>S-Followers</small></div>
                <div><span>50</span><br><small>S-Following</small></div>
                <div><span>120</span><br><small>Posts</small></div>
            </div>
            <br>
            <button class="input-box" style="width: auto; cursor: pointer;" onclick="loginWithGoogle()">Google Sign-In / Switch Account</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('home-screen', this)">🏠<br>Home</div>
        <div class="nav-item active" onclick="switchTab('shorts-screen', this)">⚡<br>S-Shorts</div>
        <div class="nav-item" onclick="switchTab('upload-screen', this)">➕<br>Upload</div>
        <div class="nav-item" onclick="switchTab('profile-screen', this)">👤<br>Profile</div>
    </div>

    <script>
        // 1. Loading Screen Logic (Max 3 Seconds)
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 2000);

        // 2. Tab Switching Logic
        function switchTab(tabId, element) {
            // Hide all screens
            let screens = document.querySelectorAll('.app-screen');
            screens.forEach(screen => screen.classList.remove('active'));
            
            // Remove active class from nav items
            let navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            // Show selected screen
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            
            // Handle Video Play/Pause based on tab
            let video = document.getElementById('main-video');
            if(tabId === 'shorts-screen') {
                video.play();
            } else {
                video.pause();
            }
        }

        // 3. Play/Pause Video Click Logic
        const video = document.getElementById('main-video');
        const playPauseLogo = document.getElementById('play-pause-logo');
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseLogo.style.display = 'none';
            } else {
                video.pause();
                playPauseLogo.style.display = 'block';
            }
        });

        // 4. Like Button Logic (Red Color)
        function toggleLike(btn) {
            if(btn.innerHTML.includes('🤍')) {
                btn.innerHTML = '❤️<span class="action-text">1.2M</span>';
                btn.style.color = '#e50914';
            } else {
                btn.innerHTML = '🤍<span class="action-text">1.2M</span>';
                btn.style.color = 'white';
            }
        }

        // 5. Upload Progress Bar Logic (Real-time simulation)
        function updateCount(id, current, max) {
            document.getElementById(id).innerText = `${current}/${max}`;
        }

        function startUpload() {
            let file = document.getElementById('video-file').files[0];
            if(!file) {
                alert("Please select a video first!");
                return;
            }
            
            // Cloudinary Upload Logic will go here. For now, showing UI progress.
            document.getElementById('progress-bar-container').style.display = 'block';
            let bar = document.getElementById('progress-bar');
            let status = document.getElementById('upload-status');
            let width = 0;
            
            status.innerText = "Compressing & Uploading to Cloudinary...";
            status.style.color = "yellow";

            let interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    status.innerText = "Video Uploaded Successfully!";
                    status.style.color = "#0f0";
                    setTimeout(() => { document.getElementById('progress-bar-container').style.display = 'none'; }, 3000);
                } else {
                    width += 5; // Simulating upload speed
                    bar.style.width = width + '%';
                }
            }, 300);
        }

        // 6. Google Sign-In Logic (Firebase)
        function loginWithGoogle() {
            import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js").then(({ signInWithPopup }) => {
                signInWithPopup(window.auth, window.provider)
                .then((result) => {
                    alert("Welcome " + result.user.displayName);
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
            });
        }
    </script>
</body>
</html>
