<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>ShaheenX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100%;width:100%}
:root{--bg:#000;--card:#121212;--line:#222;--muted:#8a8a8a;--accent:#ff2d55;--blue:#3b82f6}
button,input,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,video{display:block}

/* LOADER */
#loader{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s}
#loader .logo{font-size:38px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
#loader .bar{width:220px;height:4px;background:#1c1c1c;border-radius:4px;overflow:hidden}
#loader .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d55,#3b82f6);transition:width .25s}
#loader .status{font-size:12px;color:var(--muted);letter-spacing:.5px}

/* AUTH */
#auth{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;padding:28px;background:radial-gradient(1200px 600px at 50% -20%,#1a0a14 0%,#000 60%)}
#auth .brand{font-size:40px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
#auth .tag{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
#auth .field{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
#auth .field input{background:none;border:none;outline:none;flex:1;font-size:15px}
#auth .btn{width:100%;padding:15px;border-radius:12px;font-weight:700;font-size:15px;margin-top:10px;transition:.15s}
#auth .primary{background:linear-gradient(135deg,#ff2d55,#ff5a7a);color:#fff}
#auth .ghost{background:#111;border:1px solid #222}
#auth .link{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
#auth .link b{color:#fff}
#auth .switch{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
#auth .switch b{color:var(--accent)}

/* APP */
#app{display:none;flex-direction:column;height:100%;width:100%}
#topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #111;background:#000;flex-shrink:0}
#topbar .name{font-size:22px;font-weight:900;background:linear-gradient(135deg,#ff2d55,#ff9500,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111}
#topbar .active{padding:6px 12px;border-radius:20px;background:#111;font-size:12px;color:#9f9}
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.active{display:block}

/* BOTTOM NAV */
#bottomnav{height:62px;display:flex;background:#000;border-top:1px solid #111;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#666;font-size:10px;font-weight:600}
#bottomnav button.on{color:#fff}
#bottomnav button svg{width:22px;height:22px}

/* HOME */
.feed{padding:12px 12px 80px}
.card{background:#0c0c0c;border:1px solid #161616;border-radius:16px;overflow:hidden;margin-bottom:14px}
.card .head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.card .head img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#222}
.card .head .nm{font-size:13px;font-weight:700}
.card .head .tm{font-size:11px;color:var(--muted)}
.card .media{width:100%;background:#000;max-height:70vh;object-fit:contain}
.card .body{padding:10px 12px}
.card .ttl{font-size:14px;font-weight:700;margin-bottom:4px}
.card .dsc{font-size:12.5px;color:#bbb;line-height:1.4}
.card .acts{display:flex;gap:18px;padding:8px 12px 12px}
.card .acts button{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#ccc}
.card .acts svg{width:18px;height:18px}
.card .acts .liked{color:var(--accent)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:#fff;margin-bottom:8px}

/* SHORTS */
#view-shorts{overflow:hidden}
#shortsWrap{height:100%;width:100%;position:relative;background:#000;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
#shortsWrap::-webkit-scrollbar{display:none}
.shorts-item{height:100%;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.shorts-item video{width:100%;height:100%;object-fit:contain;background:#000}
.shorts-info{position:absolute;left:14px;right:80px;bottom:90px;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.shorts-info .row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shorts-info .row img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.shorts-info .row .nm{font-size:15px;font-weight:800}
.shorts-info .row button{margin-left:8px;font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px;background:var(--accent);color:#fff}
.shorts-info .row button.following{background:#222;color:#fff}
.shorts-info .ttl{font-size:14px;font-weight:700;margin-bottom:4px}
.shorts-info .dsc{font-size:13px;color:#eee;line-height:1.35;max-height:56px;overflow:hidden}
.shorts-side{position:absolute;right:10px;bottom:100px;z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center}
.shorts-side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#fff}
.shorts-side svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.shorts-side .liked svg{fill:var(--accent);stroke:var(--accent)}
#playPause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2;pointer-events:none}
#playPause.show{display:flex}
#playPause svg{width:90px;height:90px;opacity:.75;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}

/* UPLOAD */
.upl{padding:16px 16px 90px}
.upl .tabs{display:flex;gap:8px;margin-bottom:18px;background:#0c0c0c;padding:5px;border-radius:14px}
.upl .tabs button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;color:#888}
.upl .tabs button.on{background:#1c1c1c;color:#fff}
.upl .drop{border:1.5px dashed #2a2a2a;border-radius:16px;padding:30px 16px;text-align:center;background:#0a0a0a;margin-bottom:14px;cursor:pointer}
.upl .drop p{font-size:13px;color:#ccc;font-weight:700}
.upl .drop small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.upl .prev{width:100%;border-radius:14px;margin-bottom:14px;background:#000;max-height:60vh;object-fit:contain}
.upl label{font-size:12px;color:#aaa;display:block;margin:10px 0 6px;font-weight:700}
.upl input[type=text],.upl textarea{width:100%;background:#0c0c0c;border:1px solid #1e1e1e;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;resize:none}
.upl .count{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.upl .count.over{color:var(--accent)}
.upl .submit{margin-top:18px;width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#ff2d55,#ff5a7a);font-weight:800;font-size:15px}
.upl .submit:disabled{opacity:.5}
.progress{margin-top:16px;display:none}
.progress.show{display:block}
.progress .track{height:6px;background:#1c1c1c;border-radius:6px;overflow:hidden}
.progress .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d55,#3b82f6);transition:width .2s}
.progress .lbl{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}

/* PROFILE */
.prof{padding-bottom:90px}
.banner{height:140px;width:100%;object-fit:cover;background:linear-gradient(135deg,#1a0a14,#0a1220);display:block}
.bannerWrap{position:relative}
.bannerWrap .edit{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700;backdrop-filter:blur(6px)}
.profHead{padding:0 16px;margin-top:-46px;position:relative}
.avatar{width:96px;height:96px;border-radius:50%;border:4px solid #000;object-fit:cover;background:#222}
.avatarWrap{position:relative;width:96px}
.avatarWrap .cam{position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;border:2px solid #000}
.profHead .nm{font-size:20px;font-weight:900;margin-top:8px}
.profHead .em{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:26px;padding:16px;margin-top:6px}
.stats div{text-align:center;font-size:11px;color:var(--muted)}
.stats div b{display:block;font-size:16px;color:#fff;font-weight:900;margin-bottom:2px}
.tabs2{display:flex;border-top:1px solid #111;border-bottom:1px solid #111;margin-top:6px}
.tabs2 button{flex:1;padding:14px;font-size:12px;font-weight:800;color:#777;border-bottom:2px solid transparent}
.tabs2 button.on{color:#fff;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.grid .cell{aspect-ratio:9/16;background:#111;overflow:hidden;position:relative}
.grid .cell video,.grid .cell img{width:100%;height:100%;object-fit:cover}
.grid .cell .cnt{position:absolute;bottom:4px;left:6px;font-size:10.5px;font-weight:800;text-shadow:0 1px 3px #000}

/* SHEET */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.sheet.show{display:flex}
.sheet .panel{background:#0e0e0e;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h4{font-size:15px;font-weight:800;margin-bottom:12px}
.sheet .item{display:flex;align-items:center;gap:12px;padding:14px 8px;border-radius:12px;font-size:14px;width:100%;text-align:left}
.sheet .item:active{background:#161616}
.sheet .item svg{width:20px;height:20px;color:#aaa}
.sheet .item.danger{color:#ff4d6d}

/* COMMENTS */
.cmtSheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:flex-end}
.cmtSheet.show{display:flex}
.cmtSheet .panel{background:#0e0e0e;width:100%;height:70vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .25s ease}
.cmtHead{padding:14px 16px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.cmtHead b{font-size:14px}
.cmtList{flex:1;overflow-y:auto;padding:8px 12px}
.cmt{display:flex;gap:10px;padding:10px 4px}
.cmt img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#222;flex-shrink:0}
.cmt .cbody{flex:1}
.cmt .cnm{font-size:12.5px;font-weight:800}
.cmt .ctx{font-size:13px;line-height:1.35;margin-top:2px;word-break:break-word}
.cmt .cmeta{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}
.cmt .cmeta button{color:var(--muted);font-size:11px;font-weight:700}
.cmt .cmeta .liked{color:var(--accent)}
.cmt .replies{margin-left:22px;border-left:1px solid #1e1e1e;padding-left:10px;margin-top:4px}
.cmtBox{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1a1a1a;display:flex;gap:8px;align-items:center;background:#0e0e0e}
.cmtBox input{flex:1;background:#161616;border:1px solid #222;border-radius:22px;padding:11px 16px;font-size:13.5px;outline:none}
.cmtBox button{padding:11px 16px;border-radius:22px;background:var(--accent);font-weight:800;font-size:13px;color:#fff}
.cmtBox button:disabled{opacity:.4}

/* TOAST */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1a1a1a;padding:11px 18px;border-radius:22px;font-size:13px;z-index:9999;opacity:0;transition:.25s;pointer-events:none;border:1px solid #262626}
#toast.show{opacity:1}

/* spinner */
.spin{width:18px;height:18px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH -->

</div>

<!-- APP -->
<div id="app">
  <header id="topbar">
    <div class="name">ShaheenX</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="active" id="activeBadge" style="display:none">● <span id="activeCount">0</span> active</div>
    </div>
  </header>

  <main id="views">
    <section class="view active" id="view-home"><div class="feed" id="feed"></div></section>
    <section class="view" id="view-shorts"><div id="shortsWrap"></div></section>
    <section class="view" id="view-upload"><div class="upl" id="uplWrap"></div></section>
    <section class="view" id="view-history"><div class="feed" id="histFeed"></div></section>
    <section class="view" id="view-profile"><div class="prof" id="profWrap"></div></section>
  </main>

  <nav id="bottomnav">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>
      Home
    </button>
    <button data-tab="shorts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
      Shorts
    </button>
    <button data-tab="upload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Upload
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      History
    </button>
    <button data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      Profile
    </button>
  </nav>
</div>

<!-- SHEETS -->
<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div class="cmtSheet" id="cmtSheet"><div class="panel">
  <div class="cmtHead"><b>Comments</b><button onclick="closeComments()" style="color:#aaa">✕</button></div>
  <div class="cmtList" id="cmtList"></div>
  <div class="cmtBox">
    <input id="cmtInput" maxlength="50" placeholder="Add a comment…"/>
    <button id="cmtSend">Post</button>
  </div>
</div></div>
<div id="toast"></div>

<script type="module">
/* ============================================================
   IMPORTS
============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase, ref, set, get, push, update, onValue, query,
  orderByChild, limitToLast, serverTimestamp, increment, runTransaction, remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   FIREBASE
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAhLi_9NuD1Zh-5o4NYen8GT9i0xwZaz_U",
  authDomain: "shaheenx-7d9ab.firebaseapp.com",
  databaseURL: "https://shaheenx-7d9ab-default-rtdb.firebaseio.com",
  projectId: "shaheenx-7d9ab",
  storageBucket: "shaheenx-7d9ab.firebasestorage.app",
  messagingSenderId: "532384586851",
  appId: "1:532384586851:web:522bfa338a1b346846ec56",

};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

/* CLOUDINARY */
const CLOUD_NAME = "dsgicshff";
const UPLOAD_PRESET = "shaheenx"; // ⚠️ unsigned preset बनाएँ

/* ============================================================
   STATE
============================================================ */
let ME = null;              // firebase user
let MEPROF = null;          // profile from RTDB
let currentTab = "home";
let postsCache = {};        // id -> post
let shortsObserver = null;
let currentShortId = null;
let viewTimers = {};
let activeUsers = 0;

/* ============================================================
   HELPERS
============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s='') => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => {
  n = Number(n||0);
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
};
const timeAgo = (t) => {
  if (!t) return 'just now';
  const s = Math.floor((Date.now()-t)/1000);
  if (s < 60) return s+'s';
  if (s < 3600) return Math.floor(s/60)+'m';
  if (s < 86400) return Math.floor(s/3600)+'h';
  if (s < 604800) return Math.floor(s/86400)+'d';
  return new Date(t).toLocaleDateString();
};
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
const initialsAvatar = (name='U') => {
  const ch = (name||'U').trim().charAt(0).toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%' height='100%' fill='#222'/><text x='50%' y='54%' font-size='54' font-family='sans-serif' fill='#fff' text-anchor='middle' dominant-baseline='middle' font-weight='900'>${ch}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
};

/* ============================================================
   LOADER
============================================================ */
function setLoad(pct, txt){
  $('loadBar').style.width = pct+'%';
  if (txt) $('loadStatus').textContent = txt;
}
async function runLoader(){
  setLoad(10, 'Booting ShaheenX…');

async function ensureProfile(user){
  const r = ref(db, 'users/'+user.uid);
  const snap = await get(r);
  if (!snap.exists()){
    await set(r, {
      uid: user.uid,
      email: user.email || '',
      displayName: user.displayName || (user.email||'').split('@')[0],
      channelName: user.displayName || (user.email||'').split('@')[0],
      photoURL: user.photoURL || '',
      bannerURL: '',
      createdAt: Date.now(),
      followers: {},
      following: {},
      postCount: 0
    });
  } else {
    // sync fields
    const d = snap.val();
    const patch = {};
    if (!d.email && user.email) patch.email = user.email;
    if (!d.photoURL && user.photoURL) patch.photoURL = user.photoURL;
    if (Object.keys(patch).length) await update(r, patch);
  }
  MEPROF = (await get(r)).val();
}

function setupShortObservers(wrap){
  if (shortsObserver) shortsObserver.disconnect();
  shortsObserver = new IntersectionObserver((entries)=>{
    entries.forEach(async (e)=>{
      const item = e.target;
      const vid = item.querySelector('video');
      const id = item.dataset.id;
      if (e.isIntersecting && e.intersectionRatio > 0.6){
        document.querySelectorAll('.shorts-item video').forEach(v => { if (v !== vid) v.pause(); });
        vid.muted = false;
        try { await vid.play(); } catch(e){ vid.muted = true; await vid.play().catch(()=>{}); }
        currentShortId = id;
        markHistory(id);
        startViewTimer(id, vid);
      } else {
        vid.pause();
        stopViewTimer(id);
      }
    });
  }, { threshold: [0, 0.6, 1], root: wrap });

  wrap.querySelectorAll('.shorts-item').forEach(it => shortsObserver.observe(it));

  // events
  wrap.querySelectorAll('.shorts-item').forEach(item=>{
    const id = item.dataset.id;
    const vid = item.querySelector('video');
    const pp = item.querySelector('.playPause');

    item.addEventListener('click', (e)=>{
      if (e.target.closest('button')) return;
      if (vid.paused){
        vid.play();
        pp.querySelector('svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
        pp.classList.add('show');
        setTimeout(()=>pp.classList.remove('show'), 450);
      } else {
        vid.pause();
        pp.querySelector('svg').innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
        pp.classList.add('show');
      }
    });

    item.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'like') await toggleShortLike(id, btn);
        if (act === 'comment') openComments(id);
        if (act === 'share') sharePost(id);
        if (act === 'save') toast('Saved to your list');
        if (act === 'follow') await toggleFollow(btn.dataset.uid, btn);
      };
    });
  });
}

function startViewTimer(id, vid){
  if (viewTimers[id]) return;
  const key = `viewed/${ME.uid}/${id}`;
  viewTimers[id] = setTimeout(async ()=>{
    // check if not viewed before
    const viewedRef = ref(db, `views/${id}/${ME.uid}`);
    const s = await get(viewedRef);
    if (s.exists()) return;
    await set(viewedRef, Date.now());
    await runTransaction(ref(db, `posts/${id}/views`), (cur) => (cur||0) + 1);
  }, 5000);

async function toggleFollow(targetUid, btn){
  if (!targetUid || targetUid === ME.uid) return;
  const myFollowRef = ref(db, `users/${ME.uid}/following/${targetUid}`);
  const theirFollowerRef = ref(db, `users/${targetUid}/followers/${ME.uid}`);
  const s = await get(myFollowRef);
  if (s.exists()){
    await remove(myFollowRef);
    await remove(theirFollowerRef);
    btn.classList.remove('following');
    btn.textContent = 'Follow';
    if (MEPROF?.following) delete MEPROF.following[targetUid];
  } else {
    await set(myFollowRef, true);
    await set(theirFollowerRef, true);
    btn.classList.add('following');
    btn.textContent = 'Following';
    MEPROF.following = MEPROF.following || {};
    MEPROF.following[targetUid] = true;
  }
}

  `;
  w.querySelectorAll('.tabs button').forEach(b=>{
    b.onclick = ()=>{ uplType = b.dataset.t; uplFile = null; renderUpload(); };
  });
  const drop = $('drop');
  const fi = $('fileInput');
  drop.onclick = ()=> fi.click();
  fi.onchange = () => {
    const f = fi.files[0];
    if (!f) return;
    if (uplType !== 'image' && f.size > 500 * 1024 * 1024) return toast('Max 500MB');
    uplFile = f;
    const wrap = $('prevWrap');
    const url = URL.createObjectURL(f);
    wrap.innerHTML = uplType==='image'
      ? `<img class="prev" src="${url}"/>`
      : `<video class="prev" src="${url}" controls playsinline></video>`;
    $('dropTitle').textContent = 'Change file';
  };
  $('tTitle').oninput = e => $('cTitle').textContent = `${e.target.value.length}/50`;
  $('tDesc').oninput = e => $('cDesc').textContent = `${e.target.value.length}/100`;
  $('btnUpload').onclick = doUpload;
}

async function doUpload(){
  const title = $('tTitle').value.trim();
  const desc  = $('tDesc').value.trim();
  if (!uplFile) return toast('Select a file first');
  if (!title)   return toast('Title required');

  $('btnUpload').disabled = true;
  $('prog').classList.add('show');
  setProg(0, 'Preparing…');

  try {
    const resourceType = uplType === 'image' ? 'image' : 'video';
    const url = await uploadToCloudinary(uplFile, resourceType, (pct)=>{
      setProg(pct, pct < 99 ? `Uploading… ${pct}%` : 'Processing…');
    });

    setProg(100, 'Saving…');
    const thumb = resourceType === 'video'
      ? url.replace('/upload/', '/upload/so_0/').replace(/\.(mp4|mov|webm)$/i, '.jpg')
      : url;

    const postRef = push(ref(db, 'posts'));
    await set(postRef, {
      id: postRef.key,
      uid: ME.uid,
      displayName: MEPROF.displayName || '',
      channelName: MEPROF.channelName || MEPROF.displayName || 'User',
      photoURL: MEPROF.photoURL || '',
      type: uplType,
      url,
      thumb,
      title,
      description: desc,
      createdAt: Date.now(),
      views: 0,
      likes: {},
      comments: {}
    });
    await update(ref(db, 'users/'+ME.uid), { postCount: increment(1) });

    toast('Uploaded successfully 🎉');
    uplFile = null;
    renderUpload();
    renderProfile();
    if (uplType === 'short') { go('shorts'); }
    else { go('home'); }
  } catch(e){
    console.error(e);
    toast('Upload failed: ' + (e.message || 'try again'));
    $('btnUpload').disabled = false;
    $('prog').classList.remove('show');
  }
}

function setProg(pct, txt){
  $('progBar').style.width = pct + '%';
  $('progPct').textContent = pct + '%';
  if (txt) $('progTxt').textContent = txt;
}

function uploadToCloudinary(file, resourceType, onProgress){
  return new Promise((resolve, reject)=>{
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fd.append('folder', 'shaheenx');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`);
    xhr.upload.onprogress = (e)=>{
      if (e.lengthComputable){
        const pct = Math.round((e.loaded / e.total) * 99);
        onProgress(pct);
      }
    };
    xhr.onload = () => {
      try {
        const data = JSON.parse(xhr.responseText);
        if (data.secure_url) resolve(data.secure_url);
        else reject(new Error(data.error?.message || 'Upload error'));
      } catch(e){ reject(new Error('Bad response')); }
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send(fd);
  });
}

/* ============================================================
   HISTORY
============================================================ */
async function markHistory(postId){
  try { await set(ref(db, `history/${ME.uid}/${postId}`), Date.now()); } catch(e){}
}

async function renderHistory(){
  const feed = $('histFeed');
  feed.innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  const s = await get(ref(db, `history/${ME.uid}`));
  const ids = [];
  s.forEach(ch => ids.push({ id: ch.key, t: ch.val() }));
  ids.sort((a,b)=> b.t - a.t);
  const posts = [];
  for (const x of ids.slice(0,50)){
    const p = postsCache[x.id] || (await get(ref(db, 'posts/'+x.id))).val();
    if (p) { p.id = x.id; posts.push(p); }
  }
  if (!posts.length){
    feed.innerHTML = `<div class="empty"><h3>No history yet</h3><p>Videos you watch will appear here.</p></div>`;
    return;
  }
  feed.innerHTML = posts.map(cardHTML).join('');
  attachCardEvents(feed);
}

/* ============================================================
   PROFILE
============================================================ */
async function renderProfile(){
  const w = $('profWrap');
  const u = MEPROF || {};
  const followers = Object.keys(u.followers||{}).length;
  const following = Object.keys(u.following||{}).length;

  w.innerHTML = `
    <div class="bannerWrap">
      <img class="banner" src="${u.bannerURL || ''}" onerror="this.style.background='linear-gradient(135deg,#1a0a14,#0a1220)';this.removeAttribute('src')"/>
      <button class="edit" id="btnBanner">Update banner</button>
    </div>
    <div class="profHead">
      <div class="avatarWrap">
        <img class="avatar" src="${u.photoURL || initialsAvatar(u.channelName||'U')}" onerror="this.src='${initialsAvatar('U')}'"/>
        <button class="cam" id="btnPic">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </div>
      <div class="nm">${esc(u.channelName || u.displayName || 'User')}</div>
      <div class="em">${esc(u.email||'')}</div>
    </div>
    <div class="stats">
      <div><b>${fmt(u.postCount||0)}</b>Posts</div>
      <div><b>${fmt(followers)}</b>Followers</div>
      <div><b>${fmt(following)}</b>Following</div>
      <div style="margin-left:auto"><button id="btnDots" style="padding:8px 14px;border-radius:20px;background:#111;font-size:12px;font-weight:800">⋯</button></div>
    </div>
    <div class="tabs2">
      <button class="on" data-pt="posts">Posts</button>
      <button data-pt="shorts">Shorts</button>
      <button data-pt="about">About</button>
    </div>
    <div id="profContent"></div>
  `;

  $('btnPic').onclick = pickProfilePic;
  $('btnBanner').onclick = pickBanner;
  $('btnDots').onclick = openProfileMenu;

  let ptab = 'posts';
  w.querySelectorAll('.tabs2 button').forEach(b=>{
    b.onclick = ()=>{
      w.querySelectorAll('.tabs2 button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      ptab = b.dataset.pt;
      renderProfContent(ptab);
    };
  });
  renderProfContent(ptab);
}

async function renderProfContent(tab){
  const c = $('profContent');
  if (!c) return;
  c.innerHTML = `<div style="padding:20px;text-align:center"><div class="spin"></div></div>`;

  if (tab === 'about'){
    c.innerHTML = `
      <div style="padding:16px;font-size:13px;line-height:1.7;color:#ccc">
        <div><b style="color:#fff">Channel:</b> ${esc(MEPROF.channelName||'')}</div>
        <div><b style="color:#fff">Email:</b> ${esc(MEPROF.email||'')}</div>
        <div><b style="color:#fff">Joined:</b> ${new Date(MEPROF.createdAt||Date.now()).toLocaleDateString()}</div>
        <div><b style="color:#fff">Account ID:</b> ${esc(ME.uid)}</div>
      </div>`;
    return;
  }

  const q = query(ref(db,'posts'), orderByChild('createdAt'), limitToLast(120));
  const s = await get(q);
  const mine = [];
  s.forEach(ch => {
    const v = ch.val();
    if (v.uid === ME.uid){
      if (tab === 'shorts' && v.type === 'short') mine.push({id: ch.key, ...v});
      if (tab === 'posts' && v.type !== 'short') mine.push({id: ch.key, ...v});
    }
  });
  mine.reverse();

  if (!mine.length){
    c.innerHTML = `<div class="empty"><p>No ${tab} yet.</p></div>`;
    return;
  }

  c.innerHTML = `<div class="grid">${mine.map(p=>`
    <div class="cell">
      ${p.type==='image'
        ? `<img src="${p.url}" loading="lazy"/>`
        : `<video src="${p.url}" muted playsinline preload="metadata" poster="${p.thumb||''}"></video>`}
      <div class="cnt">▶ ${fmt(p.views||0)}</div>
    </div>`).join('')}</div>`;
}

/* ---------- profile edit actions ---------- */
function pickProfilePic(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    toast('Uploading…');
    try {
      const url = await uploadToCloudinary(f, 'image', ()=>{});
      await update(ref(db, 'users/'+ME.uid), { photoURL: url });
      await updateProfile(ME, { photoURL: url });
      MEPROF.photoURL = url;
      renderProfile();
      toast('Profile picture updated');
    } catch(e){ toast('Failed'); }
  };
  inp.click();
}

function pickBanner(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    toast('Uploading…');
    try {
      const url = await uploadToCloudinary(f, 'image', ()=>{});
      await update(ref(db, 'users/'+ME.uid), { bannerURL: url });
      MEPROF.bannerURL = url;
      renderProfile();
      toast('Banner updated');
    } catch(e){ toast('Failed'); }
  };
  inp.click();
}

function openProfileMenu(){
  const html = `
    <h4>Account</h4>
    <button class="item" id="mEditName">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5l4 4-11 11H5v-4z"/></svg>
      Change channel name
    </button>
    <button class="item" id="mSwitch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>
      Switch account
    </button>
    <button class="item" id="mAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M2 21c0-4 4-7 10-7"/><path d="M19 14v6M16 17h6"/></svg>
      Add another account
    </button>
    <button class="item danger" id="mOut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sign out
    </button>
  `;
  openSheet(html);
  $('mEditName').onclick = async ()=>{
    const nm = prompt('New channel name (max 24)', MEPROF.channelName||'');
    if (!nm) return;
    await update(ref(db, 'users/'+ME.uid), { channelName: nm.slice(0,24) });
    MEPROF.channelName = nm.slice(0,24);
    closeSheet(); renderProfile(); toast('Channel name updated');
  };
  $('mSwitch').onclick = ()=>{ closeSheet(); authMode='login'; setAuthMode('login'); signOut(auth); };
  $('mAdd').onclick = async ()=>{ closeSheet(); try { await signInWithPopup(auth, gProvider); } catch(e){ toast(e.message); } };
  $('mOut').onclick = async ()=>{ closeSheet(); await signOut(auth); };
}

function openSheet(html){
  $('sheetPanel').innerHTML = html;
  $('sheet').classList.add('show');
}
function closeSheet(){ $('sheet').classList.remove('show'); }
$('sheet').addEventListener('click', (e)=>{ if (e.target === $('sheet')) closeSheet(); });

/* ============================================================
   DEEP LINK
============================================================ */
function handleDeepLink(){
  const p = new URLSearchParams(location.search).get('post');
  if (!p) return;
  setTimeout(()=>{
    postsCache[p] && go(postsCache[p].type === 'short' ? 'shorts' : 'home');
  }, 600);
}
